# CFRD — GitHub Actions CI
# Runs the full test suite on every push and pull request.
# Uses the pinned sklearn 1.5.0 environment to prevent model-loading failures.
#
# Resume value: "GitHub Actions CI running 99 tests on every push"
# is a strong signal for ML engineering roles.

name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]
  # Also allow manual trigger
  workflow_dispatch:

jobs:
  test:
    name: "Tests (Python ${{ matrix.python-version }})"
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies (pinned environment)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_lock.txt

      - name: Run full test suite
        run: |
          python -m pytest tests/ -v --tb=short --cov=src --cov-report=term-missing
        env:
          PYTHONPATH: ${{ github.workspace }}/src

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage

  # Separate job: lint + type check
  lint:
    name: "Lint & Type Check"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install lint tools
        run: pip install ruff mypy

      - name: Ruff lint
        run: ruff check src/ tests/ --select E,F,W,I --ignore E501 || true
        # || true: lint failures are advisory, not blocking (yet)

      - name: Type check (mypy)
        run: mypy src/predictor.py src/model_registry.py src/cnn_1d_spectrum.py --ignore-missing-imports || true

  # Separate job: verify model manifest integrity
  model-integrity:
    name: "Model Integrity Check"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install core dependencies
        run: pip install -r requirements_lock.txt

      - name: Check manifest POSIX paths (cross-platform regression)
        run: |
          python -c "
          import json, sys
          with open('models/model_manifest.json') as f:
              manifest = json.load(f)
          violations = []
          for key, entry in manifest.get('models', {}).items():
              for field in ('filepath', 'dataset_path'):
                  v = entry.get(field, '')
                  if chr(92) in v:
                      violations.append(f'{key}.{field}: {v!r}')
          if violations:
              print('FAIL: Backslashes found in manifest paths:')
              for v in violations: print(' ', v)
              sys.exit(1)
          print('OK: All manifest paths use forward slashes')
          "

      - name: Run evaluation guard tests
        run: |
          python -m pytest tests/test_evaluation_guard.py tests/test_no_group_leakage.py -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}/src
