[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "cfrd"
version = "0.1.0-pre-hardware"
description = "Compact Food Reflectance Device — 18-channel multispectral apple quality screening"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

keywords = ["spectroscopy", "food-safety", "machine-learning", "multispectral", "NIR"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Chemistry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn==1.5.0",
    "joblib>=1.3.0",
    "spectral>=0.23.1",
    "tifffile>=2023.4.12",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.15.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "tabulate>=0.9.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.28.0"]
api       = ["fastapi>=0.110.0", "uvicorn[standard]>=0.29.0", "pydantic>=2.0.0"]
dl        = ["torch>=2.0.0", "torchvision>=0.15.0"]
dev       = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
]
all       = ["cfrd[dashboard,api,dl,dev]"]

[project.scripts]
cfrd-predict   = "predictor:main_cli"
cfrd-api       = "api:main"
cfrd-dashboard = "app:main"

[project.urls]
Repository = "https://github.com/cfrd-project/cfrd"
Documentation = "https://github.com/cfrd-project/cfrd/blob/main/README.md"
"Bug Tracker" = "https://github.com/cfrd-project/cfrd/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-dir]
"" = "."

# ── pytest config ──────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"
asyncio_mode = "strict"

# ── ruff (linting) ─────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

# ── mypy (type checking) ───────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
warn_unused_imports = true
ignore_missing_imports = true
